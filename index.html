const save=async(name,data,type)=>{const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});
 try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data:blob});return toast('Saved '+name+' ✓')}}catch(x){if(x&&x.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3);toast('Downloading '+name+' ⬇')};
const zipSave=async fl=>{if(!window.JSZip)return toast('Zip tool did not load (needs internet once). Use the single .html download.');const z=new JSZip();for(const n in fl)z.file(n,fl[n]);save('website.zip',await z.generateAsync({type:'blob'}))};
async function snapPng(){try{const b=$('#board'),cl=b.cloneNode(true);cl.querySelectorAll('#sel,#gs,#mq').forEach(n=>n.remove());cl.style.cssText+=';transform:none;position:relative;box-shadow:none';cl.querySelectorAll('.el').forEach(n=>n.style.position='absolute');

 im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)),c=document.createElement('canvas');c.width=D.W*k;c.height=D.H*k;const x=c.getContext('2d');x.scale(k,k);x.drawImage(im,0,0);c.toBlob(bl=>bl?save(slugs()[D.cp]+'.png',bl):toast('PNG blocked by the browser: use the website download'),'image/png')}catch{toast('PNG is not supported here: use the website download')}}
